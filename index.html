<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classificação do Bolão</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans">

    <div class="max-w-4xl mx-auto py-10 px-4">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-emerald-600 drop-shadow-sm">🏆 Placar do Bolão 🏆</h1>
            <p class="text-gray-600 mt-2">Atualizado automaticamente a partir da TABELA</p>
        </header>

        <div class="bg-white shadow-md rounded-lg overflow-hidden">
            <table class="min-w-full leading-normal">
                <thead>
                    <tr class="bg-emerald-600 text-white text-left text-sm uppercase font-semibold">
                        <th class="px-5 py-3">Posição</th>
                        <th class="px-5 py-3">Participante</th>
                        <th class="px-5 py-3">Pontos</th>
                    </tr>
                </thead>
                <tbody id="tabela-corpo" class="divide-y divide-gray-200">
                    <tr>
                        <td colspan="3" class="px-5 py-8 text-center">
                            <div class="flex flex-col items-center justify-center space-y-3">
                                <div class="text-4xl animate-spin">⚽</div>
                                <div id="mensagem-carregamento" class="text-gray-400 font-medium animate-pulse"></div>
                            </div>
                        </td>
                    </tr>
                    
                    <tr class="animate-pulse">
                        <td class="px-5 py-4"><div class="h-5 bg-gray-200 rounded w-6"></div></td>
                        <td class="px-5 py-4"><div class="h-5 bg-gray-200 rounded w-32"></div></td>
                        <td class="px-5 py-4"><div class="h-5 bg-gray-200 rounded w-16"></div></td>
                    </tr>
                    <tr class="animate-pulse">
                        <td class="px-5 py-4"><div class="h-5 bg-gray-200 rounded w-6"></div></td>
                        <td class="px-5 py-4"><div class="h-5 bg-gray-200 rounded w-24"></div></td>
                        <td class="px-5 py-4"><div class="h-5 bg-gray-200 rounded w-16"></div></td>
                    </tr>
                    <tr class="animate-pulse">
                        <td class="px-5 py-4"><div class="h-5 bg-gray-200 rounded w-6"></div></td>
                        <td class="px-5 py-4"><div class="h-5 bg-gray-200 rounded w-40"></div></td>
                        <td class="px-5 py-4"><div class="h-5 bg-gray-200 rounded w-16"></div></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const urlPlanilha = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQdAyMuLVcXtZNNO7h6w9IEdh5C-7Nx3b9KH8lRbLgVbS72ibopJNVnUDp_PSsSuNJn_7pXU-YnopvK/pub?gid=687676323&single=true&output=csv";

        function carregarDados() {
            Papa.parse(urlPlanilha, {
                download: true,
                header: false, 
                complete: function(results) {
                    processarEExibir(results.data);
                },
                error: function(err) {
                    console.error("Erro ao ler a planilha:", err);
                    document.getElementById('tabela-corpo').innerHTML = `
                        <tr><td colspan="3" class="px-5 py-5 text-center text-red-500">Erro ao carregar dados.</td></tr>
                    `;
                }
            });
        }

        function processarEExibir(linhas) {
            const corpoTabela = document.getElementById('tabela-corpo');
            corpoTabela.innerHTML = ''; 

            let participantes = [];

            linhas.forEach((dadosLinha) => {
                if (dadosLinha && dadosLinha[3]) {
                    const textoColunaD = dadosLinha[3].toString().trim();

                    if (textoColunaD.toLowerCase().includes("pontuacao total ate agora")) {
                        const nome = dadosLinha[0] ? dadosLinha[0].trim() : '';
                        
                        let pontos = dadosLinha[5] ? dadosLinha[5].toString().replace(',', '.') : '0';
                        pontos = parseFloat(pontos) || 0;

                        if (nome) {
                            participantes.push({ nome: nome, pontos: pontos });
                        }
                    }
                }
            });

            participantes.sort((a, b) => b.pontos - a.pontos);

            participantes.forEach((participante, index) => {
                const tr = document.createElement('tr');
                // Adicionado efeito de transição suave, leve aumento de tamanho e sombra no hover
                tr.className = "hover:bg-emerald-50/50 transition-all duration-200 transform hover:scale-[1.01] hover:shadow-sm cursor-pointer";

                const posicao = index + 1;
                let medalha = posicao;
                if (posicao === 1) medalha = '🥇';
                if (posicao === 2) medalha = '🥈';
                if (posicao === 3) medalha = '🥉';

                tr.innerHTML = `
                    <td class="px-5 py-4 font-bold text-gray-700">${medalha}</td>
                    <td class="px-5 py-4 text-gray-900 font-medium">${participante.nome}</td>
                    <td class="px-5 py-4 font-bold text-emerald-600">${participante.pontos} pts</td>
                `;
                corpoTabela.appendChild(tr);
            });

            if (participantes.length === 0) {
                corpoTabela.innerHTML = `<tr><td colspan="3" class="px-5 py-5 text-center text-gray-500">Nenhum participante encontrado. Verifique se o link do CSV está correto.</td></tr>`;
            }
        }


        // --- Lógica das mensagens aleatórias de carregamento ---
        const mensagens = [
            "Zikando o Gaspar...",
            "Perguntando ao Cara...",
            "Desviando dinheiro pro Vasco...",
            "kkkkkkkk Souza perdeu 300 conto...",
            "Pagando o Paquetá...",
            "Roubando pontos do Marinho...",
            "Analisando VARmengo...",
        ];

        // Sorteia um número aleatório baseado no tamanho da lista
        const indiceSorteado = Math.floor(Math.random() * mensagens.length);

        // Encontra a div pelo ID e injeta a mensagem sorteada
        const divMensagem = document.getElementById('mensagem-carregamento');
        if (divMensagem) {
            divMensagem.innerText = mensagens[indiceSorteado];
        }

        carregarDados();
    </script>
</body>
</html>
